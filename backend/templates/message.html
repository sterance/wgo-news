{% extends "base.html" %}
{% comment %}A plain, centred message page (no React). Used by 403.html and build_missing.html.{% endcomment %}

{% block head %}
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: Canvas;
      color: CanvasText;
    }
    main {
      max-width: 32rem;
      padding: 1.5rem;
      text-align: center;
      line-height: 1.5;
    }
    .actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      align-items: center;
      margin-top: 1.5rem;
    }
    .actions form {
      margin: 0;
    }
    button {
      font: inherit;
      cursor: pointer;
    }
    code {
      font-size: 0.95em;
    }
  </style>
{% endblock %}

{% block content %}
  <main>
    {% block message %}{% endblock %}
  </main>
{% endblock %}
